<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BondiComunidad Cba 🚌</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="map"></div>
    
    <div class="ui-overlay" id="panel-interfaz">
        
        <div class="drag-area" id="btn-colapsar">
            <div class="drag-handle"></div>
        </div>

        <h1>BondiComunidad 🚌</h1>
        
        <div class="search-box">
            <input type="text" id="route-search" placeholder="🔍 Buscar línea (ej: 20, 80)...">
        </div>

        <div class="direction-toggle">
            <input type="radio" id="dir0" name="direction" value="0" checked>
            <label for="dir0">➡️ Ida</label>
            <input type="radio" id="dir1" name="direction" value="1">
            <label for="dir1">⬅️ Vuelta</label>
        </div>

        <select id="route-selector" size="5">
            <option value="">Sincronizando datos...</option>
        </select>

        <button class="loc-btn" id="btn-ubicacion">📍 Mi ubicación</button>
        <div id="status">Iniciando sistema...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
