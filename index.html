<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BondiComunidad Cba 🚌</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#d35400"> 
</head>
<body>
    <div id="map"></div>
    
    <div class="ui-overlay">
        <h1>BondiComunidad 🚌</h1>
        <p>Seleccioná tu línea para ver las paradas en tiempo real:</p>
        
        <select id="route-selector">
            <option value="">Cargando archivos...</option>
        </select>

        <button class="loc-btn" onclick="ubicarme()">
            📍 Mi ubicación actual
        </button>

        <div id="status">Iniciando aplicación...</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
